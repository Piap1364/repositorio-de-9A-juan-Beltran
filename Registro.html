<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Metal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            font-family: 'Inter', sans-serif;
        }
        .titulo {
            color: #ffffff;
            font-family: 'Metal Mania', cursive;
            font-size: 60px;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px rgba(255,255,255,0.4);
        }
        .contenedor {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #333333;
            border-radius: 4px;
            background: linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
            padding: 20px;
            box-shadow: 0 0 15px rgba(255,255,255,0.15);
        }
        .conten-principal {
            display: flex;
            border: 1px solid #333333;
            height: auto;
            min-height: 160vh;
            box-shadow: inset 0 0 30px rgba(255,255,255,0.05);
        }
        .parrafo {
            color: #cccccc;
            margin-left: 50px;
            margin-right: 50px;
            line-height: 1.6;
        }
        .conten-imagen {
            display: flex;
            border: 2px solid #333333;
            margin: 10px;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .conten-parrafo {
            display: flex;
            flex-direction: column;
            border: 1px solid #333333;
            margin: 10px;
            width: 100%;
            padding: 10px;
        }
        .p-nombre {
            color: #ffffff;
            font-family: 'Metal Mania', cursive;
            font-size: 48px;
            text-align: center;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255,255,255,0.6);
            padding: 10px 0;
        }
        .botones_1 {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .boton_1 {
            display: inline-block;
            padding: 12px 28px;
            color: #ffffff;
            background: transparent;
            border: 2px solid #ffffff;
            border-radius: 4px;
            text-decoration: none;
            box-shadow: 0 0 8px rgba(255,255,255,0.4), inset 0 0 10px rgba(255,255,255,0.1);
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Metal Mania', cursive;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .boton_1:hover {
            background: #ffffff;
            color: #000;
            box-shadow: 0 0 20px rgba(255,255,255,0.8), inset 0 0 15px rgba(255,255,255,0.3);
        }
        .horario {
            color: #cccccc;
            text-align: center;
            border: 1px solid #333333;
            margin-top: 20px;
            padding: 10px;
        }
        .h-titulo {
            font-family: 'Metal Mania', cursive;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            margin-bottom: 10px;
        }
        .tabla {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #333333;
        }
        .tabla th, .tabla td {
            border: 1px solid #333333;
            padding: 8px;
            text-align: center;
        }
        .tabla th {
            background-color: #1a1a1a;
            color: #ffffff;
            font-weight: 700;
        }
        .tabla td {
            background-color: #0a0a0a;
            color: #cccccc;
        }
        .modo-hacker th {
            background-color: #87CEFA !important;
            color: #000 !important;
        }
        .modo-hacker td {
            background-color: #FFD700 !important;
            color: #000 !important;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #333333;
            background: #0a0a0a;
        }
        .imagen-perfil {
            max-width: 300px;
            max-height: 400px;
            width: auto;
            height: auto;
            object-fit: cover;
            border-radius: 4px;
            border: 2px solid #333333;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .conten-imagen {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        label {
            color: #ffffff;
            font-family: 'Metal Mania', cursive;
            letter-spacing: 1px;
        }
        input[type="text"],
        input[type="password"] {
            padding: 12px;
            border: 2px solid #333333;
            border-radius: 4px;
            background: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        button[type="submit"] {
            padding: 12px 28px;
            color: #ffffff;
            background: transparent;
            border: 2px solid #ffffff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Metal Mania', cursive;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        button[type="submit"]:hover {
            background: #ffffff;
            color: #000;
            box-shadow: 0 0 20px rgba(255,255,255,0.8), inset 0 0 15px rgba(255,255,255,0.3);
        }
        body{
            background-color: rgb(0, 217, 255);
        }
        .hii{
            color:rgb(217, 255, 0)
        }
        .holajuanito{
            background-color:crimson
        }
    </style>
</head>
<body>
    <header>
        <div class="contenedor">
            <h1 class="titulo">registro</h1>
        </div>
    </header>
    <br>
    <div class="conten-principal">
        <div class="conten-parrafo">
            <h1 class="p-nombre">registro de usuario</h1>
            
            <!-- Formulario de captura de datos -->
            <form action="Registro.html" method="post">
                
                <!-- Campo para el Nombre de Usuario -->
                <label for="nombre">Nombre de Usuario:</label>
                <input type="text" id="nombre" name="nombre" required>

                <!-- Campo oculto para la Contraseña -->
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>

                <!-- Botón para enviar el formulario -->
                <button type="submit" class="boton_1">Registrarse</button>
                
            </form>
            
            <div class="botones_1">
                <a href="index.html" class="boton_1">Volver al inicio</a>
                <a href="menu.html" class="boton_1">Menú principal</a>
            </div>
        </div>
    </div>
</body>
</html>
